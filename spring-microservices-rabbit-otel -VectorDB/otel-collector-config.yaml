receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

extensions:
  health_check: {}

exporters:
  # ── Trace backends ────────────────────────────────────────
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # ── Metrics backend ───────────────────────────────────────
  prometheus:
    endpoint: "0.0.0.0:8889"
    enable_open_metrics: true

  # ── Log backend ───────────────────────────────────────────
  otlphttp/loki:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true

  # ── Telemetry pipeline (traces → pgvector via Python service)
  otlphttp/pipeline:
    endpoint: "http://telemetry-pipeline:9000"
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlp/jaeger, otlp/tempo, otlphttp/pipeline]

    metrics:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [prometheus]

    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlphttp/loki]
